name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (for agent.js harness & userscript syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Verify environment
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run Flutter & JS harness tests
        run: flutter test

      - name: Check userscript syntax
        run: node --check "userscript/米家极客版-自动登录.user.js"
